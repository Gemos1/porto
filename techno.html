<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techno Vibes 🎧</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .profile-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #fa709a;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .bio {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 40px;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .instagram-button {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 8px 20px rgba(250, 112, 154, 0.4);
        }

        .soundcloud-button {
            background: linear-gradient(135deg, #ff5e3a 0%, #ff2a68 100%);
            box-shadow: 0 8px 20px rgba(255, 94, 58, 0.4);
        }

        .social-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .social-icon {
            width: 28px;
            height: 28px;
        }

        .back-button {
            margin-top: 30px;
            color: #999;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .back-button:hover {
            color: #fa709a;
        }

        /* Placeholder pour l'image - REMPLACER avec votre vraie photo */
        .placeholder-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            margin: 0 auto 25px;
            border: 5px solid #fa709a;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .bio {
                font-size: 16px;
            }
            
            .social-button {
                font-size: 18px;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- REMPLACER cette div par : <img src="photo-dj.jpg" alt="DJ photo" class="profile-photo"> -->
        <div class="placeholder-photo">🎧</div>
        
        <h1>Let's vibe! 🎧</h1>

        </div>
        
        <br>
        <a href="index.html" class="back-button">← Go back</a>
    </div>
</body>
</html>
