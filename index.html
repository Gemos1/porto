<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Adventure 💫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .photo-container {
            margin-bottom: 30px;
        }

        .couple-photo {
            width: 250px;
            height: 250px;
            border-radius: 20px;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Placeholder pour l'image - REMPLACER avec votre vraie photo */
        .placeholder-couple-photo {
            width: 250px;
            height: 250px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            margin: 0 auto;
            border: 4px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .intro-text {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 18px;
            margin-bottom: 50px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .choice-button {
            padding: 25px 40px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .girl-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .boy-button {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .techno-button {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .choice-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .choice-button:active {
            transform: translateY(-2px);
        }

        .emoji {
            font-size: 28px;
            margin-left: 10px;
        }

        @media (max-width: 480px) {
            .couple-photo, .placeholder-couple-photo {
                width: 200px;
                height: 200px;
            }
            
            .intro-text {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .choice-button {
                font-size: 20px;
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="photo-container">
            <img src="photo-couple.png" alt="Us" class="couple-photo">
        </div>
        
        <h1 class="intro-text">Did we catch your eye? 👀</h1>
        <p class="subtitle">(We are FRIENDS we are NOT a couple)</p>
        
        <div class="button-container">
            <a href="girl.html" class="choice-button girl-button">
                If you like girls, click here <span class="emoji">💕</span>
            </a>
            
            <a href="boy.html" class="choice-button boy-button">
                If you like boys, click here <span class="emoji">💙</span>
            </a>
            
            <a href="techno.html" class="choice-button techno-button">
                If you like Techno, click here <span class="emoji">🎧</span>
            </a>
        </div>
    </div>
</body>
</html>
